<style>
  :root {
    --bleu: #305496;
    --bleu-clair: #d9e2f3;
    --gris-texte: #444;
    --gris-fond: #f4f6fb;
    --gris-bordure: #dde3ee;
    --vert: #1e7d46;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--gris-fond);
    color: #1a1a1a;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  .page { max-width: 640px; margin: 0 auto; padding: 0 0 40px; }
  header.topbar {
    background: var(--bleu);
    color: #fff;
    padding: 18px 20px 16px;
    text-align: center;
  }
  header.topbar .app-title {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: .06em;
    opacity: .85;
    margin: 0 0 6px;
  }
  header.topbar .nom {
    font-size: 24px;
    font-weight: 700;
    margin: 0;
    line-height: 1.25;
  }
  .total-general {
    display: inline-block;
    margin-top: 10px;
    background: rgba(255,255,255,.16);
    border-radius: 999px;
    padding: 6px 16px;
    font-size: 14px;
    font-weight: 600;
  }
  main { padding: 16px 14px 0; }
  .jour-bloc {
    background: #fff;
    border: 1px solid var(--gris-bordure);
    border-radius: 14px;
    margin-bottom: 16px;
    overflow: hidden;
    box-shadow: 0 1px 3px rgba(20,30,60,.05);
  }
  .jour-entete {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    background: var(--bleu-clair);
    padding: 10px 16px;
  }
  .jour-entete .jour-nom {
    font-weight: 700;
    font-size: 16px;
    color: var(--bleu);
  }
  .jour-entete .jour-total {
    font-size: 13px;
    color: var(--bleu);
    font-weight: 600;
  }
  .tache {
    display: flex;
    gap: 12px;
    padding: 12px 16px;
    border-top: 1px solid var(--gris-bordure);
  }
  .tache:first-of-type { border-top: none; }
  .tache .heure {
    flex: 0 0 auto;
    width: 62px;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--gris-texte);
    line-height: 1.35;
    padding-top: 2px;
  }
  .tache .contenu { flex: 1 1 auto; min-width: 0; }
  .tache .ligne-titre {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .badge-numero {
    display: inline-block;
    font-size: 11.5px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .titre-tache {
    font-weight: 600;
    font-size: 14.5px;
  }
  .commentaire {
    margin-top: 4px;
    font-size: 12.5px;
    color: #666;
    white-space: pre-line;
    line-height: 1.4;
  }
  .avec-qui {
    margin-top: 4px;
    font-size: 12.5px;
    color: #d40000;
    line-height: 1.4;
  }
  .duree {
    margin-top: 5px;
    font-size: 11.5px;
    color: var(--vert);
    font-weight: 600;
  }
  .total-final {
    text-align: center;
    background: #fff;
    border: 1px solid var(--gris-bordure);
    border-radius: 14px;
    padding: 16px;
    margin: 4px 0 8px;
    font-size: 15px;
    font-weight: 700;
    color: var(--bleu);
  }
  .total-final span { color: var(--vert); }
  footer {
    text-align: center;
    font-size: 11.5px;
    color: #99a2b3;
    padding: 10px 20px 0;
  }

  /* --- Recherche (quand aucun ?id= valide n'est fourni) --- */
  .recherche { padding: 16px 14px; }
  .recherche h2 { font-size: 17px; color: var(--bleu); margin: 4px 0 10px; }
  .recherche p { font-size: 13.5px; color: #667; margin: 0 0 14px; }
  .recherche input {
    width: 100%;
    padding: 12px 14px;
    font-size: 15px;
    border: 1px solid var(--gris-bordure);
    border-radius: 10px;
    margin-bottom: 12px;
  }
  .liste-resultats { display: flex; flex-direction: column; gap: 8px; }
  .resultat-item {
    display: block;
    background: #fff;
    border: 1px solid var(--gris-bordure);
    border-radius: 10px;
    padding: 12px 14px;
    text-decoration: none;
    color: #1a1a1a;
    font-size: 14.5px;
    font-weight: 600;
  }
  .resultat-item small { display: block; font-weight: 400; color: #888; font-size: 12px; margin-top: 2px; }
  .vide { text-align: center; color: #888; font-size: 13.5px; padding: 30px 10px; }
</style>

function formatDuree(h) {
  const totalMin = Math.round(h * 60);
  const hh = Math.floor(totalMin / 60);
  const mm = totalMin % 60;
  if (hh === 0) return mm + "min";
  return mm === 0 ? (hh + "h") : (hh + "h" + String(mm).padStart(2, "0"));
}
function texteContrasteSur(hex) {
  hex = (hex || "#999999").replace("#", "");
  const r = parseInt(hex.substring(0,2),16), g = parseInt(hex.substring(2,4),16), b = parseInt(hex.substring(4,6),16);
  return (0.299*r + 0.587*g + 0.114*b) < 140 ? "#ffffff" : "#1a1a1a";
}
function echapper(s) {
  const d = document.createElement("div");
  d.textContent = s == null ? "" : String(s);
  return d.innerHTML;
}
function getParam(nom) {
  const params = new URLSearchParams(window.location.search);
  let v = params.get(nom);
  if (!v && window.location.hash) v = window.location.hash.replace(/^#\/?/, "");
  return v ? v.trim().toUpperCase() : "";
}

function rendreBenevole(id, b) {
  let html = "";
  html += '<header class="topbar">';
  html += '  <p class="app-title">Mon planning bénévole</p>';
  html += '  <p class="nom">' + echapper(b.prenom) + " " + echapper(b.nom).toUpperCase() + '</p>';
  html += '  <span class="total-general">Total : ' + formatDuree(b.total) + '</span>';
  html += '</header>';
  html += '<main>';
  if (!b.jours.length) {
    html += '<div class="vide">Aucune tâche ne vous est actuellement assignée.<br>Ce planning peut encore évoluer : revenez consulter cette page régulièrement.</div>';
  } else {
    for (const j of b.jours) {
      html += '<section class="jour-bloc">';
      html += '  <div class="jour-entete"><span class="jour-nom">' + echapper(j.jour) + '</span><span class="jour-total">' + formatDuree(j.total) + '</span></div>';
      for (const t of j.taches) {
        const coul = t.couleur || "#999999";
        html += '<div class="tache">';
        html += '  <div class="heure">' + t.hd + '<br>' + t.hf + '</div>';
        html += '  <div class="contenu">';
        html += '    <div class="ligne-titre"><span class="badge-numero" style="background:' + coul + ';color:' + texteContrasteSur(coul) + '">' + echapper(t.numero) + '</span><span class="titre-tache">' + echapper(t.titre) + '</span></div>';
        if (t.commentaire) html += '<div class="commentaire">' + echapper(t.commentaire) + '</div>';
        if (t.avecQui) html += '<div class="avec-qui">Avec : ' + echapper(t.avecQui) + '</div>';
        html += '    <div class="duree">' + formatDuree(t.duree) + '</div>';
        html += '  </div>';
        html += '</div>';
      }
      html += '</section>';
    }
    html += '<div class="total-final">Total de vos heures sur l\'événement : <span>' + formatDuree(b.total) + '</span></div>';
  }
  html += '</main>';
  html += '<footer>Planning généré le ' + echapper(DATA.genere) + '. En cas de doute, contactez l\'organisation.</footer>';
  return html;
}

function rendreRecherche(filtre) {
  filtre = (filtre || "").toLowerCase();
  let html = '<header class="topbar"><p class="app-title">Mon planning bénévole</p><p class="nom" style="font-size:19px">Retrouvez votre planning</p></header>';
  html += '<div class="recherche">';
  html += '<p>Le lien scanné ne correspond à aucun bénévole connu, ou aucun identifiant n\'a été fourni. Recherchez votre nom ci-dessous :</p>';
  html += '<input type="search" id="recherche-input" placeholder="Tapez votre nom..." autocomplete="off" value="' + echapper(filtre) + '">';
  html += '<div class="liste-resultats" id="liste-resultats"></div>';
  html += '</div>';
  return html;
}

function listeFiltreeHTML(filtre) {
  const entries = Object.entries(DATA.benevoles)
    .filter(([id, b]) => !filtre || (b.nom + " " + b.prenom).toLowerCase().includes(filtre))
    .sort((a, b) => (a[1].nom + a[1].prenom).localeCompare(b[1].nom + b[1].prenom));
  if (!filtre) return "";
  if (!entries.length) return '<div class="vide">Aucun résultat.</div>';
  return entries.slice(0, 12).map(([id, b]) =>
    '<a class="resultat-item" href="?id=' + encodeURIComponent(id) + '">' + echapper(b.prenom) + ' ' + echapper(b.nom) +
    '<small>' + formatDuree(b.total) + ' sur l\'événement</small></a>'
  ).join("");
}

function demarrer() {
  const id = getParam("id");
  const page = document.getElementById("page");
  if (id && DATA.benevoles[id]) {
    page.innerHTML = rendreBenevole(id, DATA.benevoles[id]);
  } else {
    page.innerHTML = rendreRecherche("");
    const input = document.getElementById("recherche-input");
    const liste = document.getElementById("liste-resultats");
    input.addEventListener("input", () => { liste.innerHTML = listeFiltreeHTML(input.value); });
    input.focus();
  }
}
demarrer();
