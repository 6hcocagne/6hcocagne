{nomComplet: "CALVET Isabelle",nomDUV: "",runnerID: "",dossard: "29",kmTotal: "",resume: "",courses: "",records: "",infos: "<strong>Sur quelle épreuve êtes-vous inscrit ? :</strong><br>6 heures course<br><br><strong>Depuis combien de temps courez-vous ? :</strong><br>Avril 2026<br><br><strong>Votre palmarès :</strong><br>Chaque nouvelle distance est encore une petite victoire ! Ma plus grande distance à ce jour est 15 km, réalisée récemment<br><br><strong>Quelle performance vous rend le plus fier ? :</strong><br>Toutes celles où je dépasse la précédente !<br><br><strong>Votre objectif sur La Cocagne :</strong><br>Tenir les 6 heures et voir jusqu’où je suis capable d’aller !<br><br><strong>Dites-nous quelque chose sur vous que vous aimeriez que l'animateur raconte au départ ou pendant la course :</strong><br>À la base, j’étais plutôt du genre à juger les gens qui couraient, je trouvais que c'était pour les gens chiants. J’ai commencé en avril 2026 uniquement pour travailler mon cardio pour la boxe et je ne sais pas par quel miracle des dieux, j’ai adoré ! Depuis, je passe mes week-ends à m’inscrire à des courses : La Cocagne, un semi-marathon en novembre, des trails… Et mon objectif le plus fou : une Backyard de 24 heures prévue en mai.<br><br><strong>Utilisation par l'animateur :</strong><br>J'autorise l'animateur à utiliser mes réponses pendant la course<br><br><strong>Utilisation en communication :</strong><br>J'autorise aussi leur utilisation sur les supports de communication de l'événement<br><br>"},

{nomComplet: "CASBAS Guillaume",nomDUV: "",runnerID: "",dossard: "222",kmTotal: "",resume: "",courses: "",records: "",infos: "<strong>Sur quelle épreuve êtes-vous inscrit ? :</strong><br>3 heures course<br><br><strong>Depuis combien de temps courez-vous ? :</strong><br>7 ans (depuis 2019)<br><br><strong>Votre palmarès :</strong><br>- Trail du Louron (aout 2026): 27km 1600d+<br>- Trail Rivières et chateaux (juin 2026): 30km 370d+<br>- 6h de cocagne, course 3h (sept 2025): 25km (25 tours valides)<br><br><strong>Quelle performance vous rend le plus fier ? :</strong><br>Le trail du Louron dans les Pyrénées: mon premier trail en montagne, j'ai du puiser dans le mental pour arriver à passer cette ligne d'arrivée (très, voire trop, proche de la barrière horaire)<br><br><strong>Une anecdote sur une course :</strong><br>Au mois d'aout je me suis pointé à Loudenvielle pour le trail du Louron (1600d+, 1 100d-) sans avoir vérifié l'état de mes chaussures au préalable… Il se trouve qu'elles avaient 690 km au compteur et donc étaient complètement lisses. J'ai glissé sur toutes les montées et toutes les descentes: mes articulations me détestent encore.<br><br><strong>Votre objectif sur La Cocagne :</strong><br>2 choses: Premièrement pour partager l'ambiance, j'ai réussi à faire inscrire plusieurs membres de ma famille. Et deuxièmement, c'est une course de test d'allure/nutrition pour mon premier marathon au mois de novembre<br><br><strong>Dites-nous quelque chose sur vous que vous aimeriez que l'animateur raconte au départ ou pendant la course :</strong><br>L'ambiance de l'année précédente était tellement chouette, que cette année participerons aussi mon frère, ma mère, ma tante et mon oncle ! Il aurait aussi pu y avoir ma compagne, mais il fallait bien que qqun se sacrifie pour la bonne cause: garder nos enfants<br><br><strong>Une chose à dire, une promo, une association à mettre en avant ? :</strong><br>Un immense MERCI pour les organisateurs et bénévoles ! C'est génial d'avoir un tel évènement dans mon village.<br><br><strong>Utilisation par l'animateur :</strong><br>J'autorise l'animateur à utiliser mes réponses pendant la course<br><br><strong>Utilisation en communication :</strong><br>J'autorise aussi leur utilisation sur les supports de communication de l'événement<br><br>"},

function afficherCoureur() {

  const div = document.getElementById('fiche');
  if (idx === "") { div.style.display = 'none'; return; }
  const c = coureurs[idx];
  let html = '<h2>' + c.nomComplet + '</h2>';
